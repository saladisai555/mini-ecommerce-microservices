spring:
  datasource:
    url: jdbc:sqlserver://localhost:1434;databaseName=ORDER_DB;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:SqlServer@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect

product:
  service:
    url: http://localhost:8081

inventory:
  service:
    url: http://localhost:8083